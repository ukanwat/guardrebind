[project]
name = "guard-policy-injection"
version = "0.1.0"
description = "Nothing to See Here: Fooling LLM Safety Guards into Judging the Wrong Text (code and data)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.52",
    "accelerate>=1.0",
    "huggingface-hub>=0.26",
    "sentencepiece>=0.2",
    "pandas>=2.2",
    "peft>=0.21.2",
    "datasets>=5.1.0",
    "scikit-learn>=1.9.1",
    "numpy>=2.0",
    "scipy>=1.11",
]

[tool.setuptools]
packages = ["src"]
