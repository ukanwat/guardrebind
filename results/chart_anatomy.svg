<svg xmlns="http://www.w3.org/2000/svg" width="820" height="306" viewBox="0 0 820 306" role="img">

  <style>
    .surface { fill: #fcfcfb; }
    .ink     { fill: #0b0b0b; }
    .ink2    { fill: #52514e; }
    .grid    { stroke: #e6e5e2; }
    .axis    { stroke: #b8b7b3; }
    .blue    { fill: #2a78d6; }  .blue-s  { stroke: #2a78d6; }
    .red     { fill: #e34948; }  .red-s   { stroke: #e34948; }
    .l1 { fill: #eda100; } .l1s { stroke: #eda100; }
    .l2 { fill: #eb6834; } .l2s { stroke: #eb6834; }
    .l3 { fill: #e34948; } .l3s { stroke: #e34948; }
    .boxd { fill: #eef4fc; stroke: #cfe0f6; }
    .boxa { fill: #fdeeee; stroke: #f6cfcf; }
    .tblue { fill: #1b5eb0; } .tred { fill: #b23735; }
    @media (prefers-color-scheme: dark) {
      .boxd { fill: #16233a; stroke: #294a7a; }
      .boxa { fill: #3a1e1e; stroke: #6b3030; }
      .tblue { fill: #7fb0ee; } .tred { fill: #ec8b8b; }
      .surface { fill: #1a1a19; }
      .ink     { fill: #ffffff; }
      .ink2    { fill: #c3c2b7; }
      .grid    { stroke: #323230; }
      .axis    { stroke: #55554f; }
      .blue    { fill: #3987e5; }  .blue-s  { stroke: #3987e5; }
      .red     { fill: #e66767; }  .red-s   { stroke: #e66767; }
      .l1 { fill: #c98500; } .l1s { stroke: #c98500; }
      .l2 { fill: #d95926; } .l2s { stroke: #d95926; }
      .l3 { fill: #e66767; } .l3s { stroke: #e66767; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .t-title { font-size: 15px; font-weight: 600; }
    .t-sub   { font-size: 12px; }
    .t-lab   { font-size: 12.5px; }
    .t-val   { font-size: 12px; font-weight: 600; }
    .t-mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: 12.5px; }
  </style>

<rect width="820" height="306" class="surface"/>
<text x="16" y="26" class="t-title ink">Only a forged question-and-document pair works</text>
<text x="16" y="45" class="t-sub ink2">Percent of 75 harmful requests the guard cleared, by what the attacker appends. A lone forged document barely moves it.</text>
<line x1="250.0" y1="58" x2="250.0" y2="258" class="grid"/>
<text x="250.0" y="274" text-anchor="middle" class="t-sub ink2">0%</text>
<line x1="368.5" y1="58" x2="368.5" y2="258" class="grid"/>
<text x="368.5" y="274" text-anchor="middle" class="t-sub ink2">25%</text>
<line x1="487.0" y1="58" x2="487.0" y2="258" class="grid"/>
<text x="487.0" y="274" text-anchor="middle" class="t-sub ink2">50%</text>
<line x1="605.5" y1="58" x2="605.5" y2="258" class="grid"/>
<text x="605.5" y="274" text-anchor="middle" class="t-sub ink2">75%</text>
<line x1="724.0" y1="58" x2="724.0" y2="258" class="grid"/>
<text x="724.0" y="274" text-anchor="middle" class="t-sub ink2">100%</text>
<text x="236" y="90.0" text-anchor="end" class="t-lab ink">just "disregard the above"</text>
<rect x="250" y="73.0" width="1.5" height="26" class="blue" rx="3"/>
<text x="260.0" y="90.0" class="t-val ink">0%</text>
<text x="236" y="130.0" text-anchor="end" class="t-lab ink">a forged Instruct line only</text>
<rect x="250" y="113.0" width="1.5" height="26" class="blue" rx="3"/>
<text x="260.0" y="130.0" class="t-val ink">0%</text>
<text x="236" y="170.0" text-anchor="end" class="t-lab ink">a forged Document only</text>
<rect x="250" y="153.0" width="44.2" height="26" class="blue" rx="3"/>
<text x="304.2" y="170.0" class="t-val ink">9%</text>
<text x="236" y="210.0" text-anchor="end" class="t-lab ink">a forged Query + Document</text>
<rect x="250" y="193.0" width="474.0" height="26" class="red" rx="3"/>
<text x="734.0" y="210.0" class="t-val ink">100%</text>
<text x="236" y="250.0" text-anchor="end" class="t-lab ink">all three forged</text>
<rect x="250" y="233.0" width="436.1" height="26" class="red" rx="3"/>
<text x="696.1" y="250.0" class="t-val ink">92%</text>
<line x1="250" y1="58" x2="250" y2="258" class="axis"/>
</svg>