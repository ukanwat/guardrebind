<svg xmlns="http://www.w3.org/2000/svg" width="780" height="250" viewBox="0 0 780 250" role="img">

  <style>
    .surface { fill: #fcfcfb; }
    .ink     { fill: #0b0b0b; }
    .ink2    { fill: #52514e; }
    .grid    { stroke: #e6e5e2; }
    .axis    { stroke: #b8b7b3; }
    .blue    { fill: #2a78d6; }  .blue-s  { stroke: #2a78d6; }
    .red     { fill: #e34948; }  .red-s   { stroke: #e34948; }
    .l1 { fill: #eda100; } .l1s { stroke: #eda100; }
    .l2 { fill: #eb6834; } .l2s { stroke: #eb6834; }
    .l3 { fill: #e34948; } .l3s { stroke: #e34948; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink     { fill: #ffffff; }
      .ink2    { fill: #c3c2b7; }
      .grid    { stroke: #323230; }
      .axis    { stroke: #55554f; }
      .blue    { fill: #3987e5; }  .blue-s  { stroke: #3987e5; }
      .red     { fill: #e66767; }  .red-s   { stroke: #e66767; }
      .l1 { fill: #c98500; } .l1s { stroke: #c98500; }
      .l2 { fill: #d95926; } .l2s { stroke: #d95926; }
      .l3 { fill: #e66767; } .l3s { stroke: #e66767; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .t-title { font-size: 15px; font-weight: 600; }
    .t-sub   { font-size: 12px; }
    .t-lab   { font-size: 12.5px; }
    .t-val   { font-size: 12px; font-weight: 600; }
  </style>

<rect width="780" height="250" class="surface"/>
<text x="16" y="26" class="t-title ink">The guard grades whichever document lands last</text>
<text x="16" y="45" class="t-sub ink2">Bypass rate by how harmful the trailing decoy is on its own. A jailbreak would clear regardless; this tracks the decoy.</text>
<line x1="250.0" y1="60" x2="250.0" y2="210" class="grid"/>
<text x="250.0" y="226" text-anchor="middle" class="t-sub ink2">0%</text>
<line x1="360.0" y1="60" x2="360.0" y2="210" class="grid"/>
<text x="360.0" y="226" text-anchor="middle" class="t-sub ink2">25%</text>
<line x1="470.0" y1="60" x2="470.0" y2="210" class="grid"/>
<text x="470.0" y="226" text-anchor="middle" class="t-sub ink2">50%</text>
<line x1="580.0" y1="60" x2="580.0" y2="210" class="grid"/>
<text x="580.0" y="226" text-anchor="middle" class="t-sub ink2">75%</text>
<line x1="690.0" y1="60" x2="690.0" y2="210" class="grid"/>
<text x="690.0" y="226" text-anchor="middle" class="t-sub ink2">100%</text>
<text x="234" y="96.0" text-anchor="end" class="t-lab ink">benign decoy</text>
<text x="234" y="113.0" text-anchor="end" class="t-sub ink2">scores 0.00 alone</text>
<line x1="250" y1="92.0" x2="690.0" y2="92.0" class="l1s" stroke-width="3"/>
<circle cx="690.0" cy="92.0" r="7" class="l1"/>
<text x="706.0" y="96.0" class="t-val ink">100%</text>
<text x="234" y="148.0" text-anchor="end" class="t-lab ink">borderline decoy</text>
<text x="234" y="165.0" text-anchor="end" class="t-sub ink2">scores 0.03 alone</text>
<line x1="250" y1="144.0" x2="396.7" y2="144.0" class="l2s" stroke-width="3"/>
<circle cx="396.7" cy="144.0" r="7" class="l2"/>
<text x="412.7" y="148.0" class="t-val ink">33%</text>
<text x="234" y="200.0" text-anchor="end" class="t-lab ink">harmful decoy</text>
<text x="234" y="217.0" text-anchor="end" class="t-sub ink2">scores ~1.0 alone</text>
<line x1="250" y1="196.0" x2="250.0" y2="196.0" class="l3s" stroke-width="3"/>
<circle cx="250.0" cy="196.0" r="7" class="l3"/>
<text x="266.0" y="200.0" class="t-val ink">0%</text>
<line x1="250" y1="60" x2="250" y2="210" class="axis"/>
</svg>